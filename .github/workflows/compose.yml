name: Compose
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deploy scripts and both Compose profiles
        run: |
          shellcheck deploy/release scripts/init-env
          scripts/init-env
          export API_IMAGE=portfolio-api:check
          docker compose --project-directory deploy config --quiet
          docker compose --project-directory deploy --profile https config --quiet
